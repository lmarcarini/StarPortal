# Continuous integration: lint, import and tests on every pull request and every push to main.
# Bible: technical-architecture.md#testing-and-tooling
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pull requests: one group per branch, and a newer push cancels the older run.
# Everything else (pushes to main): one group per run, so a run is never cancelled, neither
# while in progress nor while pending behind a newer one. Covers both the ci and soak jobs.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
    && format('ci-pr-{0}', github.ref)
    || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The gdtoolkit version is written only in .gdtoolkit-version; bump it deliberately,
      # together with any reformatting it causes.
      - name: Read gdtoolkit version
        id: gdtoolkit
        run: |
          version="$(tr -d '[:space:]' < .gdtoolkit-version)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=.gdtoolkit-version::expected 'X.Y.Z', got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check gdtoolkit version has a single source
        env:
          GDTOOLKIT_VERSION: ${{ steps.gdtoolkit.outputs.version }}
        run: |
          # Tracked text files only (so .git/ is never searched); vendored addons/ are skipped.
          if git grep -n -I -F -e "$GDTOOLKIT_VERSION" -- . \
              ':(exclude)addons/' ':(exclude).gdtoolkit-version'; then
            echo "::error::gdtoolkit version $GDTOOLKIT_VERSION is repeated above; use .gdtoolkit-version only"
            exit 1
          fi
          echo "gdtoolkit $GDTOOLKIT_VERSION is written only in .gdtoolkit-version"

      - name: Install gdtoolkit
        env:
          GDTOOLKIT_VERSION: ${{ steps.gdtoolkit.outputs.version }}
        run: python -m pip install --disable-pip-version-check "gdtoolkit==${GDTOOLKIT_VERSION}"

      - name: Lint
        run: scripts/lint.sh

      # The expected hash comes from SHA512-SUMS.txt of the same godot-builds release as the
      # zip; nothing is hard-coded. It is also part of the cache key.
      - name: Read Godot version and checksum
        id: godot
        run: |
          full="$(tr -d '[:space:]' < .godot-version)"   # e.g. 4.7.2.stable
          number="${full%.stable}"                         # e.g. 4.7.2
          if [ "$full" = "$number" ]; then
            echo "::error file=.godot-version::expected '<version>.stable', got '$full'"
            exit 1
          fi
          name="Godot_v${number}-stable_linux.x86_64"
          release="https://github.com/godotengine/godot-builds/releases/download/${number}-stable"
          sums="$(curl -fsSL --retry 3 "$release/SHA512-SUMS.txt")"
          sha512="$(printf '%s\n' "$sums" | awk -v f="$name.zip" '$2 == f { print $1 }')"
          if ! printf '%s' "$sha512" | grep -Eq '^[0-9a-f]{128}$'; then
            echo "::error::no SHA-512 for $name.zip in $release/SHA512-SUMS.txt"
            exit 1
          fi
          {
            echo "number=$number"
            echo "name=$name"
            echo "url=$release/$name.zip"
            echo "sha512=$sha512"
            echo "zip-dir=$RUNNER_TOOL_CACHE/godot-zip-$number"
            echo "dir=$RUNNER_TEMP/godot-$number"
          } >> "$GITHUB_OUTPUT"

      - name: Cache Godot zip
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.godot.outputs.zip-dir }}
          key: godot-${{ steps.godot.outputs.number }}-stable-linux.x86_64-${{ steps.godot.outputs.sha512 }}

      # Downloads on a cache miss, then always verifies the zip (fresh or cached) before
      # unpacking it. A mismatch fails here, before Godot ever runs.
      - name: Download and verify Godot
        env:
          GODOT_NAME: ${{ steps.godot.outputs.name }}
          GODOT_URL: ${{ steps.godot.outputs.url }}
          GODOT_SHA512: ${{ steps.godot.outputs.sha512 }}
          GODOT_ZIP_DIR: ${{ steps.godot.outputs.zip-dir }}
          GODOT_DIR: ${{ steps.godot.outputs.dir }}
          CACHE_HIT: ${{ steps.godot-cache.outputs.cache-hit }}
        run: |
          zip="$GODOT_ZIP_DIR/$GODOT_NAME.zip"
          if [ "$CACHE_HIT" != "true" ]; then
            mkdir -p "$GODOT_ZIP_DIR"
            curl -fsSL --retry 3 -o "$zip" "$GODOT_URL"
          fi
          if ! echo "$GODOT_SHA512  $zip" | sha512sum --check --strict; then
            echo "::error::$GODOT_NAME.zip does not match SHA512-SUMS.txt of its release"
            rm -f "$zip"
            exit 1
          fi
          mkdir -p "$GODOT_DIR"
          unzip -q "$zip" -d "$GODOT_DIR"
          mv "$GODOT_DIR/$GODOT_NAME" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"

      - name: Locate Godot
        env:
          GODOT_DIR: ${{ steps.godot.outputs.dir }}
        run: |
          echo "GODOT_BIN=$GODOT_DIR/godot" >> "$GITHUB_ENV"
          "$GODOT_DIR/godot" --headless --version

      - name: Import project
        run: '"$GODOT_BIN" --headless --path . --import'

      - name: Tests
        id: tests
        run: scripts/test.sh

      - name: Upload test reports
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: test-reports
          path: .godot/test-reports/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # One in-game year with a save and load every month (tests/soak). Runs only on pushes to
  # main, never on pull requests. Bible: technical-architecture.md#testing-and-tooling
  soak:
    name: soak
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request' # TEMPORARY
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The expected hash comes from SHA512-SUMS.txt of the same godot-builds release as the
      # zip; nothing is hard-coded. It is also part of the cache key.
      - name: Read Godot version and checksum
        id: godot
        run: |
          full="$(tr -d '[:space:]' < .godot-version)"   # e.g. 4.7.2.stable
          number="${full%.stable}"                         # e.g. 4.7.2
          if [ "$full" = "$number" ]; then
            echo "::error file=.godot-version::expected '<version>.stable', got '$full'"
            exit 1
          fi
          name="Godot_v${number}-stable_linux.x86_64"
          release="https://github.com/godotengine/godot-builds/releases/download/${number}-stable"
          sums="$(curl -fsSL --retry 3 "$release/SHA512-SUMS.txt")"
          sha512="$(printf '%s\n' "$sums" | awk -v f="$name.zip" '$2 == f { print $1 }')"
          if ! printf '%s' "$sha512" | grep -Eq '^[0-9a-f]{128}$'; then
            echo "::error::no SHA-512 for $name.zip in $release/SHA512-SUMS.txt"
            exit 1
          fi
          {
            echo "number=$number"
            echo "name=$name"
            echo "url=$release/$name.zip"
            echo "sha512=$sha512"
            echo "zip-dir=$RUNNER_TOOL_CACHE/godot-zip-$number"
            echo "dir=$RUNNER_TEMP/godot-$number"
          } >> "$GITHUB_OUTPUT"

      - name: Cache Godot zip
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.godot.outputs.zip-dir }}
          key: godot-${{ steps.godot.outputs.number }}-stable-linux.x86_64-${{ steps.godot.outputs.sha512 }}

      # Downloads on a cache miss, then always verifies the zip (fresh or cached) before
      # unpacking it. A mismatch fails here, before Godot ever runs.
      - name: Download and verify Godot
        env:
          GODOT_NAME: ${{ steps.godot.outputs.name }}
          GODOT_URL: ${{ steps.godot.outputs.url }}
          GODOT_SHA512: ${{ steps.godot.outputs.sha512 }}
          GODOT_ZIP_DIR: ${{ steps.godot.outputs.zip-dir }}
          GODOT_DIR: ${{ steps.godot.outputs.dir }}
          CACHE_HIT: ${{ steps.godot-cache.outputs.cache-hit }}
        run: |
          zip="$GODOT_ZIP_DIR/$GODOT_NAME.zip"
          if [ "$CACHE_HIT" != "true" ]; then
            mkdir -p "$GODOT_ZIP_DIR"
            curl -fsSL --retry 3 -o "$zip" "$GODOT_URL"
          fi
          if ! echo "$GODOT_SHA512  $zip" | sha512sum --check --strict; then
            echo "::error::$GODOT_NAME.zip does not match SHA512-SUMS.txt of its release"
            rm -f "$zip"
            exit 1
          fi
          mkdir -p "$GODOT_DIR"
          unzip -q "$zip" -d "$GODOT_DIR"
          mv "$GODOT_DIR/$GODOT_NAME" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"

      - name: Locate Godot
        env:
          GODOT_DIR: ${{ steps.godot.outputs.dir }}
        run: |
          echo "GODOT_BIN=$GODOT_DIR/godot" >> "$GITHUB_ENV"
          "$GODOT_DIR/godot" --headless --version

      - name: Import project
        run: '"$GODOT_BIN" --headless --path . --import'

      - name: Soak
        id: soak
        run: scripts/soak.sh

      - name: Upload soak reports
        if: failure() && steps.soak.outcome == 'failure'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: soak-reports
          path: .godot/test-reports/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
